name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Catches broken R8 / ProGuard rules here rather than at release time.
      # Unsigned is fine — this only needs to prove the build succeeds.
      - name: Build release APK (unsigned, verifies R8)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Flavour-qualified task names: lintDebug no longer exists once flavours
      # are declared. Both variants are checked.
      - name: Lint
        run: ./gradlew lintLegacyDebug lintPlayDebug --no-daemon

      # assembleDebug/assembleRelease build every flavour, so both the KitKat
      # (legacy) and Play (minSdk 21) variants are verified on each push.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
